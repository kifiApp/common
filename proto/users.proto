syntax = "proto3";

option go_package = "github.com/kifiApp/common/gen;gen";


package kifi.users;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";
import "family.proto";
import "devices.proto";


message Family {
  int64 id = 1;
  string name = 2;
  repeated kifi.users.Member members = 3;
}

message Member {
  int64 id = 1;
  kifi.users.User user = 2;
  int64 familyID = 3;
  kifi.users.Family family = 4;
  kifi.users.Role role = 5;
  repeated kifi.users.Permission permission = 6;
}

message User {
  int64 Id = 1;
  string Username = 2;
  bool IsOwner = 3;
  bool AgreementSigned = 4;
  string phoneNumber = 5;
  UserInfo info = 6;
  kifi.users.Member Person = 7;
  google.protobuf.Timestamp createdAt = 8;
  google.protobuf.Timestamp updatedAt = 9;
}


message UserListRequests {
  int32 limit = 1;
  int32 offset = 2;
}


message UserListResponse {
  repeated kifi.users.User users = 1;
}

message UserInfo{
  string Name = 1;
  string AvatarPath = 2;
  int32 MonthlyIncome=3;
  int32 MonthlyOutcome=4;
  int32 Savings=5;
}

message UserSignupRequest {
  string Username = 1;
  bool IsOwner = 2;
  bool AgreementSigned = 3;
  string phoneNumber = 4;
  bytes password = 5;
  string DeviceID = 6;
}

message UserSignupResponse {
  int64 user = 1;
}

message UserLoginRequest {
  string Username = 1;
  bytes password = 2;
}

message UserLoginResponse {
  string AccessToken = 1;
  string RefreshToken = 2;
  string TokenUID = 3;
  kifi.users.User User = 4;
}

message AuthRequest {
  string token = 1;
}

message AuthResponse {
  int64 userID = 1;
}

message RefreshTokenRequest {
  string tokenUUID = 1;
}

message RefreshTokenResponse {
  string AccessToken = 1;
  string RefreshToken = 2;
  string TokenUID = 3;
  int64 UserID = 4;
}

message UserUpdateRequest {
  int64 id = 1;
  UserInfo info = 2;
  bool IsOwner = 3;
  bool AgreementSigned = 4;
}

message UserUpdateResponse {
  bool isUpdated = 1;
}

message UserDeleteRequest {
  string id = 1;
}

message UserDeleteResponse {
  bool isDeleted = 1;
}

message UserGetRequest {
  int64 id = 1;
}

message UserGetResponse {
  kifi.users.User user = 1;
}



message FamilyCreateRequest{
  kifi.users.User owner = 1;
  string Name = 2;
}

message FamilyCreateResponse{
  kifi.users.Family family = 1;
}

message FamilyAssignMemberRequest{
  int64 familyID = 1;
  kifi.users.Member member = 2;
}

message FamilyAssignMemberResponse{
  bool isAssigned = 1;
}

message FamilyMembersRequest{
  int64 familyID = 1;
}

message FamilyMembersResponse{
  repeated kifi.users.Member members = 1;
}




service Users {
  rpc Signup(UserSignupRequest) returns (UserSignupResponse);
  rpc Login(UserLoginRequest) returns (UserLoginResponse);
  rpc Auth(AuthRequest) returns (AuthResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Update(UserUpdateRequest) returns (UserUpdateResponse);
  rpc Delete(UserDeleteRequest) returns (UserDeleteResponse);
  rpc Get(UserGetRequest) returns (UserGetResponse);
  rpc List(UserListRequests) returns (UserListResponse);
  rpc CreateFamily(FamilyCreateRequest) returns (FamilyCreateResponse);
  rpc AssignMember(FamilyAssignMemberRequest) returns (FamilyAssignMemberResponse);
  rpc Health(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc RegisterDevice(UserDevice) returns (UserDevice);
  rpc GetUserDevice(GetUserDevicesRequest) returns (UserDevice);
  rpc UpdateUserDevice(UpdateUserDeviceRequest) returns (google.protobuf.Empty);
}





