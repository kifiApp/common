syntax = "proto3";

option go_package = "github.com/kifiApp/common/gen;gen";




message UserDevice{
  int64 id = 1;
  int64 userID = 2;
  string deviceID = 3;
  string platform = 4;
  string systemName = 5;
  string systemVersion = 6;
  string brand = 7;
}


message GetUserDevicesRequest{
  int64 userID = 1;
  string deviceID = 2;
}

message UpdateUserDeviceRequest{
  int64 id = 1;
  string  deviceID = 2;
  int64 userID = 3;
  string platform = 4;
  string systemName = 5;
  string systemVersion = 6;
  string brand = 7;
}





