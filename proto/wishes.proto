syntax = "proto3";

option go_package = "github.com/kifiApp/common/gen;gen";


package kifi.goals;

import "google/protobuf/timestamp.proto";

message Wish {
  int64 id = 1;
  int64 user_id= 2;
  int64 family_id = 3;
  string category = 4;
  bytes wishData = 5;
  bool is_completed = 6;
  bool is_family_wish = 7;
  bool is_private = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp notification_date = 11;
}

message TravelWish {
  string title = 1;
  string destination = 2;
  string price = 3;
  string totalAmount = 4;
  string photoUrl = 5;
  string description = 6;
}

message ProductWish {
  string title = 1;
  string price = 2;
  string totalAmount = 3;
  string photoUrl = 4;
  string description = 5;
}

message EntertainmentWish {
  string title = 1;
  string price = 2;
  string totalAmount = 3;
  string photoUrl = 4;
  string description = 5;
}

message WishList {
  repeated Wish wishes = 1;
}