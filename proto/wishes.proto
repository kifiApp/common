syntax = "proto3";

option go_package = "github.com/kifiApp/common/gen;gen";


package kifi.goals;

import "google/protobuf/timestamp.proto";

message Wish {
  int64 id = 1;
  int64 user_id= 2;
  int64 family_id = 3;
  int64 notification_duration = 4;
  string category = 5;
  bytes wishData = 6;
  string price = 7;
  string collectedAmount = 8;
  bool is_completed = 9;
  bool is_family_wish = 10;
  bool is_private = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message TravelWish {
  string title = 1;
  string destination = 2;
  string price = 3;
  string totalAmount = 4;
  string photoUrl = 5;
  string description = 6;
}

message ProductWish {
  string title = 1;
  string price = 2;
  string totalAmount = 3;
  string photoUrl = 4;
  string description = 5;
}

message EntertainmentWish {
  string title = 1;
  string price = 2;
  string totalAmount = 3;
  string photoUrl = 4;
  string description = 5;
}

message WishList {
  repeated Wish wishes = 1;
}

message WishImage {
  int64 id = 1;
  int64 wishID = 2;
  string imageURL = 3;
  string bitmapURL = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message WishImageList {
  repeated WishImage images = 1;
}

message WishTransaction{
  int64 id = 1;
  int64 wishID = 2;
  int64 userID = 3;
  int64 accountID = 4;
  string paymentAmount = 5;
  string remainingAmount = 6;
  string TransactionStatus = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message WishTransactionList {
  repeated WishTransaction transactions = 1;
}