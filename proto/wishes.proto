syntax = "proto3";

option go_package = "github.com/kifiApp/common/gen;gen";


package kifi.goals;

import "google/protobuf/timestamp.proto";

message Wish {
  int64 id = 1;
  int64 user_id= 2;
  int64 family_id = 3;
  string category = 5;
  bytes wishData = 6;
  string price = 7;
  bool is_family_wish = 8;
  bool is_private = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message TravelWish {
  string title = 1;
  string destination = 2;
  string price = 3;
  string totalAmount = 4;
  string photoUrl = 5;
  string description = 6;
}

message ProductWish {
  string title = 1;
  string price = 2;
  string totalAmount = 3;
  string photoUrl = 4;
  string description = 5;
}

message EntertainmentWish {
  string title = 1;
  string price = 2;
  string totalAmount = 3;
  string photoUrl = 4;
  string description = 5;
}

message WishList {
  repeated Wish wishes = 1;
}

message WishImage {
  int64 id = 1;
  int64 wishID = 2;
  string imageURL = 3;
  string bitmapURL = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message WishImageList {
  repeated WishImage images = 1;
}

message Goal{
  int64 id = 1;
  Wish wish = 2;
  int64 notificationDuration = 3;
  string collectedAmount = 4;
  bool is_completed = 5;
  bool is_family_wish = 6;
  bool is_private = 7;
  int32 priority = 8;
  google.protobuf.Timestamp start_date = 9;
  google.protobuf.Timestamp end_date = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message GoalList{
  repeated Goal goals = 1;
}

message GoalTransaction{
  int64 id = 1;
  int64 wishID = 2;
  int64 userID = 3;
  int64 accountID = 4;
  string paymentAmount = 5;
  string remainingAmount = 6;
  string TransactionStatus = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message GoalTransactionList {
  repeated GoalTransaction transactions = 1;
}