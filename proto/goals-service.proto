syntax = "proto3";

option go_package = "github.com/kifiApp/common/gen;gen";


package kifi.goals.service.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";
import "goals.proto";


message CreateWishRequest {
  int64 userId = 1;
  kifi.goals.Wish wish = 2;
}

message CreateWishResponse {
  int64 wishID = 1;
}

message UpdateWishRequest{
  kifi.goals.Wish wish = 1;
}

message DeleteWishRequest{
  int64 wishID = 1;
}

message CreateGoalRequest{
  int64 userId = 1;
  kifi.goals.Goal goal = 2;
}

message CreateGoalResponse{
  int64 goalID = 1;
}

message UpdateGoalRequest{
  kifi.goals.Goal goal = 1;
}

message DeleteGoalRequest{
  int64 goalID = 1;
}

message MakeWishAsGoalRequest{
  kifi.goals.Wish wishObj = 1;
  string price = 2;
  google.protobuf.Timestamp deadline = 3;
}

message MakeWishAsGoalResponse{
  int64 goalID = 1;
}

message GetUserWishesRequest {
  int64 userId = 1;
}

message GetUserWishesResponse {
  repeated kifi.goals.Wish wishes = 1;
}

message GetUserGoalsRequest{
  int64 userId = 1;
}

message GetUserGoalsResponse{
  repeated kifi.goals.Goal goals = 1;
}

message GetWishByIDRequest {
  int64 wishID = 1;
}

message GetGoalByIDRequest{
  int64 goalID = 1;
}

message GetFamilyWishesRequest {
  int64 userId = 1;
  int64 familyId = 2;
}

message GetFamilyGoalsRequest {
  int64 userId = 1;
  int64 familyId = 2;
}

message GetFamilyWishesResponse {
  int64 familyId = 1;
  repeated kifi.goals.Wish wishes = 2;
}

message GetFamilyGoalsResponse {
  int64 familyId = 1;
  repeated kifi.goals.Goal goals = 2;
}

message AddImageToWishRequest {
  int64 wishID = 1;
  string imageUrl = 2;
  string bitmapUrl = 3;
}

message ListImagesRequest {
  int64 wishID = 1;
}

message CompleteGoalRequest {
  int64 goalID = 1;
}

message GoalSortRequest{
  kifi.goals.Goal goal = 1;
  int32 priority = 2;
}


message GoalSortResponse{
  int32 priority = 1;
}


service Goals{
  rpc CreateWish(CreateWishRequest) returns (CreateWishResponse);
  rpc UpdateWish(UpdateWishRequest) returns (google.protobuf.Empty);
  rpc DeleteWish(DeleteWishRequest) returns (google.protobuf.Empty);
  rpc CreateGoal(CreateGoalRequest) returns (CreateGoalResponse);
  rpc UpdateGoal(UpdateGoalRequest) returns (google.protobuf.Empty);
  rpc DeleteGoal(DeleteGoalRequest) returns (google.protobuf.Empty);
  rpc MakeGoalFromWish(MakeWishAsGoalRequest) returns (MakeWishAsGoalResponse);
  rpc GetUserWishes(GetUserWishesRequest) returns (GetUserWishesResponse);
  rpc GetUserGoals(GetUserGoalsRequest) returns (GetUserGoalsResponse);
  rpc GetGoalByID(GetGoalByIDRequest) returns (kifi.goals.Goal);
  rpc GetWishByID(GetWishByIDRequest) returns (kifi.goals.Wish);
  rpc GetFamilyWishes(GetFamilyWishesRequest) returns (GetFamilyWishesResponse);
  rpc GetFamilyGoals(GetFamilyGoalsRequest) returns (GetFamilyGoalsResponse);
  rpc AddImagesToWish(AddImageToWishRequest) returns (google.protobuf.Empty);
  rpc ListImages(ListImagesRequest) returns (kifi.goals.WishImageList);
  rpc CompleteGoal(CompleteGoalRequest) returns (google.protobuf.Empty);
  rpc CheckSorting(GoalSortRequest) returns (GoalSortResponse);
}