syntax = "proto3";

option go_package = "github.com/kifiApp/common/gen;gen";


package kifi.goals;

import "google/protobuf/timestamp.proto";

message Wish {
  int64 id = 1;
  int64 userId = 2;
  int64 familyId = 3;
  bytes wishData = 6;
  bool isFamilyWish = 8;
  bool isPrivate = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message WishData {
  string title = 1;
  string price = 2;
  string category = 3;
  string link = 4;
  string description = 5;
  repeated WishImage images = 6;
}

message WishList {
  repeated Wish wishes = 1;
}

message WishImage {
  string imageURL = 3;
  string bitmapURL = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message WishImageList {
  repeated WishImage images = 1;
}

message Goal{
  int64 id = 1;
  Wish wish = 2;
  int64 notificationDuration = 3;
  string collectedAmount = 4;
  bool isCompleted = 5;
  int32 priority = 6;
  google.protobuf.Timestamp deadline = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message GoalList{
  repeated Goal goals = 1;
}
