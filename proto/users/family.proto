syntax = "proto3";

package kifi.users;

enum Role {
  OWNER = 0;
  PARTICIPANT = 1;
  CHILD = 2;
}

enum Permissions {
  READ = 0;
  CREATE = 1;
  DONATE = 2;
  UPDATE = 3;
}

message Permission{
  Permissions permission = 1;
  bool granted = 2;
}

message Member {
  int64 id = 1;
  int64 userID = 2;
  int64 familyID = 3;
  Family family = 4;
  Role role = 5;
  Permission permission = 6;
}


message Family {
  int64 id = 1;
  string name = 2;
  repeated Member members = 3;
}