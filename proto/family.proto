syntax = "proto3";

option go_package = "github.com/kifiApp/common/gen;gen";

package kifi.users;


enum Role {
  OWNER = 0;
  PARTICIPANT = 1;
  CHILD = 2;
}

enum Permissions {
  READ = 0;
  CREATE = 1;
  DONATE = 2;
  UPDATE = 3;
}

message Permission{
  Permissions permission = 1;
  bool granted = 2;
}



